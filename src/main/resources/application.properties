# ===============================================
# Tabloid Service Configuration
# ===============================================

# -----------------------------------------------
# XLSX Output Settings
# -----------------------------------------------

# General settings
# If true, columns will be automatically resized to fit their content.
tabloid.output.xlsx.auto-size-columns=true


# --- Header Row Style ---
# Font settings for the header row.
tabloid.output.xlsx.header.font.name=Calibri
tabloid.output.xlsx.header.font.size=11
tabloid.output.xlsx.header.font.bold=true
tabloid.output.xlsx.header.font.italic=false
# Optional: Set a font color using a preset name.
# Common names: BLACK, WHITE, RED, BLUE, GREEN, YELLOW, ORANGE, VIOLET
tabloid.output.xlsx.header.font.color=BLACK
# Optional: Set a background color using a preset name.
# Common names: GREY_25_PERCENT, LIGHT_BLUE, LIGHT_YELLOW, CORNFLOWER_BLUE
tabloid.output.xlsx.header.background-color=GREY_25_PERCENT


# --- Data Row Style ---
# Font settings for the data rows.
tabloid.output.xlsx.data.font.name=Calibri
tabloid.output.xlsx.data.font.size=11
tabloid.output.xlsx.data.font.bold=false
tabloid.output.xlsx.data.font.italic=false
tabloid.output.xlsx.data.font.color=BLACK
tabloid.output.xlsx.data.background-color=

# --- XLSX Row Header Style ---
tabloid.output.xlsx.row-header.font.name=Calibri
tabloid.output.xlsx.row-header.font.size=11
tabloid.output.xlsx.row-header.font.bold=true
tabloid.output.xlsx.row-header.font.italic=false
tabloid.output.xlsx.row-header.font.color=BLACK
tabloid.output.xlsx.row-header.background-color=GREY_25_PERCENT

# --- XLSX Footer Row Style ---
tabloid.output.xlsx.footer.font.name=Calibri
tabloid.output.xlsx.footer.font.size=11
tabloid.output.xlsx.footer.font.bold=true
tabloid.output.xlsx.footer.font.italic=false
tabloid.output.xlsx.footer.font.color=BLACK
tabloid.output.xlsx.footer.background-color=GREY_25_PERCENT

# -----------------------------------------------
# ODS Output Settings
# -----------------------------------------------

# --- Header Row Style ---
# Font settings for the header row.
tabloid.output.ods.header.font.name=Calibri
tabloid.output.ods.header.font.size=11
tabloid.output.ods.header.font.bold=true
tabloid.output.ods.header.font.italic=false
tabloid.output.ods.header.font.color=BLACK
tabloid.output.ods.header.background-color=GREY_25_PERCENT

# --- Data Row Style ---
# Font settings for the data rows.
tabloid.output.ods.data.font.name=Calibri
tabloid.output.ods.data.font.size=11
tabloid.output.ods.data.font.bold=false
tabloid.output.ods.data.font.italic=false
tabloid.output.ods.data.font.color=BLACK
tabloid.output.ods.data.background-color=

# --- ODS Row Header Style ---
tabloid.output.ods.row-header.font.name=Calibri
tabloid.output.ods.row-header.font.size=11
tabloid.output.ods.row-header.font.bold=true
tabloid.output.ods.row-header.font.italic=false
tabloid.output.ods.row-header.font.color=BLACK
tabloid.output.ods.row-header.background-color=GREY_25_PERCENT

# --- ODS Footer Row Style ---
tabloid.output.ods.footer.font.name=Calibri
tabloid.output.ods.footer.font.size=11
tabloid.output.ods.footer.font.bold=true
tabloid.output.ods.footer.font.italic=false
tabloid.output.ods.footer.font.color=BLACK
tabloid.output.ods.footer.background-color=GREY_25_PERCENT

# -----------------------------------------------
# CSV Output Settings
# -----------------------------------------------
tabloid.output.csv.delimiter=,
tabloid.output.csv.charset=UTF-8
tabloid.output.csv.include-header=true
tabloid.output.csv.always-quote-empty-strings=true
tabloid.output.csv.always-quote-strings=true
tabloid.output.csv.omit-missing-tail-columns=true
tabloid.output.csv.trim-values=true

# --- Optional Escape Characters (no default value) ---
# To use, uncomment one of the following lines and provide a single character.
# tabloid.output.csv.escape-control-chars-with-escape-char=\
# tabloid.output.csv.escape-quote-char-with-escape-char=\

# -----------------------------------------------
# HTML Output Settings
# -----------------------------------------------
tabloid.output.html.css=classpath:default.css