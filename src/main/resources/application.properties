# ===============================================
# Tabloid Service Configuration
# ===============================================

# --- Reusable Style Variables ---
default.font.name=Calibri
default.font.size=11
default.font.color=BLACK
default.font.italic=false
default.header.footer.font.bold=true
default.data.font.bold=false
default.header.footer.background-color=GREY_25_PERCENT

# -----------------------------------------------
# XLSX Output Settings
# -----------------------------------------------

# General settings
# If true, columns will be automatically resized to fit their content.
tabloid.output.xlsx.auto-size-columns=true

# --- Header Row Style ---
tabloid.output.xlsx.header.font.name=${default.font.name}
tabloid.output.xlsx.header.font.size=${default.font.size}
tabloid.output.xlsx.header.font.bold=${default.header.footer.font.bold}
tabloid.output.xlsx.header.font.italic=${default.font.italic}
tabloid.output.xlsx.header.font.color=${default.font.color}
tabloid.output.xlsx.header.background-color=${default.header.footer.background-color}

# --- Data Row Style ---
tabloid.output.xlsx.data.font.name=${default.font.name}
tabloid.output.xlsx.data.font.size=${default.font.size}
tabloid.output.xlsx.data.font.bold=${default.data.font.bold}
tabloid.output.xlsx.data.font.italic=${default.font.italic}
tabloid.output.xlsx.data.font.color=${default.font.color}
tabloid.output.xlsx.data.background-color=

# --- XLSX Row Header Style ---
tabloid.output.xlsx.row-header.font.name=${default.font.name}
tabloid.output.xlsx.row-header.font.size=${default.font.size}
tabloid.output.xlsx.row-header.font.bold=${default.header.footer.font.bold}
tabloid.output.xlsx.row-header.font.italic=${default.font.italic}
tabloid.output.xlsx.row-header.font.color=${default.font.color}
tabloid.output.xlsx.row-header.background-color=${default.header.footer.background-color}

# --- XLSX Footer Row Style ---
tabloid.output.xlsx.footer.font.name=${default.font.name}
tabloid.output.xlsx.footer.font.size=${default.font.size}
tabloid.output.xlsx.footer.font.bold=${default.header.footer.font.bold}
tabloid.output.xlsx.footer.font.italic=${default.font.italic}
tabloid.output.xlsx.footer.font.color=${default.font.color}
tabloid.output.xlsx.footer.background-color=${default.header.footer.background-color}

# -----------------------------------------------
# ODS Output Settings
# -----------------------------------------------

# --- Header Row Style ---
tabloid.output.ods.header.font.name=${default.font.name}
tabloid.output.ods.header.font.size=${default.font.size}
tabloid.output.ods.header.font.bold=${default.header.footer.font.bold}
tabloid.output.ods.header.font.italic=${default.font.italic}
tabloid.output.ods.header.font.color=${default.font.color}
tabloid.output.ods.header.background-color=${default.header.footer.background-color}

# --- Data Row Style ---
tabloid.output.ods.data.font.name=${default.font.name}
tabloid.output.ods.data.font.size=${default.font.size}
tabloid.output.ods.data.font.bold=${default.data.font.bold}
tabloid.output.ods.data.font.italic=${default.font.italic}
tabloid.output.ods.data.font.color=${default.font.color}
tabloid.output.ods.data.background-color=

# --- ODS Row Header Style ---
tabloid.output.ods.row-header.font.name=${default.font.name}
tabloid.output.ods.row-header.font.size=${default.font.size}
tabloid.output.ods.row-header.font.bold=${default.header.footer.font.bold}
tabloid.output.ods.row-header.font.italic=${default.font.italic}
tabloid.output.ods.row-header.font.color=${default.font.color}
tabloid.output.ods.row-header.background-color=${default.header.footer.background-color}

# --- ODS Footer Row Style ---
tabloid.output.ods.footer.font.name=${default.font.name}
tabloid.output.ods.footer.font.size=${default.font.size}
tabloid.output.ods.footer.font.bold=${default.header.footer.font.bold}
tabloid.output.ods.footer.font.italic=${default.font.italic}
tabloid.output.ods.footer.font.color=${default.font.color}
tabloid.output.ods.footer.background-color=${default.header.footer.background-color}

# -----------------------------------------------
# CSV Output Settings
# -----------------------------------------------
tabloid.output.csv.delimiter=,
tabloid.output.csv.charset=UTF-8
tabloid.output.csv.include-header=true
tabloid.output.csv.always-quote-empty-strings=true
tabloid.output.csv.always-quote-strings=true
tabloid.output.csv.omit-missing-tail-columns=true
tabloid.output.csv.trim-values=true

# --- Optional Escape Characters (no default value) ---
# To use, uncomment one of the following lines and provide a single character.
# tabloid.output.csv.escape-control-chars-with-escape-char=\
# tabloid.output.csv.escape-quote-char-with-escape-char=\

# -----------------------------------------------
# HTML Output Settings
# -----------------------------------------------
tabloid.output.html.css=classpath:default.css