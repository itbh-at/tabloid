# ===============================================
# Test Configuration for Styling
# ===============================================

# --- XLSX Settings ---
tabloid.output.xlsx.header.font.bold=true
tabloid.output.xlsx.data.font.bold=false
tabloid.output.xlsx.data.font.name=Arial
tabloid.output.xlsx.auto-size-columns=true
tabloid.output.xlsx.header.background-color=GREY_25_PERCENT

# --- ODS Settings (Visually Distinct for Manual Verification) ---
# Header: Big, Bold, Blue Text on a Yellow Background
tabloid.output.ods.header.font.name=Arial
tabloid.output.ods.header.font.size=16
tabloid.output.ods.header.font.bold=true
tabloid.output.ods.header.font.color=BLUE
tabloid.output.ods.header.background-color=YELLOW

# Data: Small, Italic, Grey Text, No Background
tabloid.output.ods.data.font.name=Calibri
tabloid.output.ods.data.font.size=10
tabloid.output.ods.data.font.bold=false
tabloid.output.ods.data.font.italic=true
tabloid.output.ods.data.font.color=GREY_25_PERCENT
tabloid.output.ods.data.background-color=

# -----------------------------------------------
# CSV Output Settings
# -----------------------------------------------
tabloid.output.csv.delimiter=,
tabloid.output.csv.charset=UTF-8
tabloid.output.csv.include-header=true
tabloid.output.csv.always-quote-empty-strings=true
tabloid.output.csv.always-quote-strings=true
tabloid.output.csv.omit-missing-tail-columns=true
tabloid.output.csv.trim-values=true

# -----------------------------------------------
# HTML Output Settings
# -----------------------------------------------
tabloid.output.html.css=classpath:default.css