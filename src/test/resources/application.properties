# ===============================================
# Test Configuration for Styling
# ===============================================

# --- Base Style Variables ---
test.font.name.default=Calibri
test.font.size.default=11
test.font.color.default=BLACK
test.background.color.default=GREY_25_PERCENT

# --- XLSX Settings ---
tabloid.output.xlsx.auto-size-columns=true
tabloid.output.xlsx.header.font.name=${test.font.name.default}
tabloid.output.xlsx.header.font.size=${test.font.size.default}
tabloid.output.xlsx.header.font.bold=true
tabloid.output.xlsx.header.font.italic=false
tabloid.output.xlsx.header.font.color=${test.font.color.default}
tabloid.output.xlsx.header.background-color=${test.background.color.default}

tabloid.output.xlsx.data.font.name=Arial
tabloid.output.xlsx.data.font.size=${test.font.size.default}
tabloid.output.xlsx.data.font.bold=false
tabloid.output.xlsx.data.font.italic=false
tabloid.output.xlsx.data.font.color=${test.font.color.default}
tabloid.output.xlsx.data.background-color=

tabloid.output.xlsx.row-header.font.name=${test.font.name.default}
tabloid.output.xlsx.row-header.font.size=${test.font.size.default}
tabloid.output.xlsx.row-header.font.bold=true
tabloid.output.xlsx.row-header.font.italic=false
tabloid.output.xlsx.row-header.font.color=${test.font.color.default}
tabloid.output.xlsx.row-header.background-color=${test.background.color.default}

tabloid.output.xlsx.footer.font.name=${test.font.name.default}
tabloid.output.xlsx.footer.font.size=${test.font.size.default}
tabloid.output.xlsx.footer.font.bold=true
tabloid.output.xlsx.footer.font.italic=false
tabloid.output.xlsx.footer.font.color=${test.font.color.default}
tabloid.output.xlsx.footer.background-color=${test.background.color.default}


# --- ODS Settings (Visually Distinct for Manual Verification) ---
# Header: Big, Bold, Blue Text on a Yellow Background
tabloid.output.ods.header.font.name=Arial
tabloid.output.ods.header.font.size=16
tabloid.output.ods.header.font.bold=true
tabloid.output.ods.header.font.italic=false
tabloid.output.ods.header.font.color=BLUE
tabloid.output.ods.header.background-color=YELLOW

# Data: Small, Italic, Grey Text, No Background
tabloid.output.ods.data.font.name=${test.font.name.default}
tabloid.output.ods.data.font.size=10
tabloid.output.ods.data.font.bold=false
tabloid.output.ods.data.font.italic=true
tabloid.output.ods.data.font.color=GREY_25_PERCENT
tabloid.output.ods.data.background-color=

# Row Header: Same as default header
tabloid.output.ods.row-header.font.name=${test.font.name.default}
tabloid.output.ods.row-header.font.size=${test.font.size.default}
tabloid.output.ods.row-header.font.bold=true
tabloid.output.ods.row-header.font.italic=false
tabloid.output.ods.row-header.font.color=${test.font.color.default}
tabloid.output.ods.row-header.background-color=${test.background.color.default}

# Footer: Same as default header
tabloid.output.ods.footer.font.name=${test.font.name.default}
tabloid.output.ods.footer.font.size=${test.font.size.default}
tabloid.output.ods.footer.font.bold=true
tabloid.output.ods.footer.font.italic=false
tabloid.output.ods.footer.font.color=${test.font.color.default}
tabloid.output.ods.footer.background-color=${test.background.color.default}


# -----------------------------------------------
# CSV Output Settings
# -----------------------------------------------
tabloid.output.csv.delimiter=,
tabloid.output.csv.charset=UTF-8
tabloid.output.csv.include-header=true
tabloid.output.csv.always-quote-empty-strings=true
tabloid.output.csv.always-quote-strings=true
tabloid.output.csv.omit-missing-tail-columns=true
tabloid.output.csv.trim-values=true

# -----------------------------------------------
# HTML Output Settings
# -----------------------------------------------
tabloid.output.html.css=classpath:default.css